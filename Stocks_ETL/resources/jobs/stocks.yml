resources:
  jobs:
    Stocks:
      name: Stocks
      tasks:
        - task_key: Load_Data
          notebook_task:
            notebook_path: ../notebooks/Data_load.ipynb
            source: WORKSPACE

        - task_key: Stocks_Bronze
          depends_on:
            - task_key: Load_Data
          pipeline_task:
            pipeline_id: ${resources.pipelines.stocks_bronze_pipeline.id}

        - task_key: Stocks_Silver
          depends_on:
            - task_key: Stocks_Bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.stocks_silver_pipeline.id}

        - task_key: Stocks_Gold
          depends_on:
            - task_key: Stocks_Silver
          pipeline_task:
            pipeline_id: ${resources.pipelines.stocks_gold_pipeline.id}

  pipelines:
    stocks_bronze_pipeline:
      name: Stocks_Bronze
      catalog: ${var.catalog}
      target: ${var.bronze_schema}
      serverless: true
      configuration:
        catalog: ${var.catalog}
        bronze_schema: ${var.bronze_schema}
      libraries:
        - notebook:
            path: ../notebooks/Stocks_Bronze.ipynb

    stocks_silver_pipeline:
      name: Stocks_Silver
      catalog: ${var.catalog}
      target: ${var.silver_schema}
      serverless: true
      configuration:
        catalog: ${var.catalog}
        silver_schema: ${var.silver_schema}
      libraries:
        - notebook:
            path: ../notebooks/Stocks_silver.ipynb

    stocks_gold_pipeline:
      name: Stocks_Gold
      catalog: ${var.catalog}
      target: ${var.gold_schema}
      serverless: true
      configuration:
        catalog: ${var.catalog}
        gold_schema: ${var.gold_schema}
      libraries:
        - notebook:
            path: ../notebooks/Stocks_Gold.ipynb